[package]
name = "kiteconnect"
version = "1.0.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Kite Connect API client for Rust: REST calls with typed responses and the WebSocket ticker"
readme = "README.md"
repository = "https://github.com/zerodha/kiteconnect-rs"
keywords = ["kite", "zerodha", "trading", "stock-market", "api"]
categories = ["api-bindings", "finance"]
include = ["/src", "/README.md", "/LICENSE"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
csv = "1.4.0"
futures-util = "0.3.34"
http = "1.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "query", "rustls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"

[dev-dependencies]
httpmock = "0.8.3"
proptest = "1.11.0"
